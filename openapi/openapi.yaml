components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      additionalProperties: false
    Visit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        placeId:
          type: string
          format: uuid
        tripId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        date:
          type: string
          format: date
        title:
          type: string
        memo:
          type: string
        photos:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              status:
                enum:
                  - pending
                  - ready
            required:
              - id
              - status
            additionalProperties: false
      required:
        - id
        - placeId
        - date
        - title
        - memo
        - photos
      additionalProperties: false
    Share:
      type: object
      properties:
        slug:
          type: string
          format: uuid
        enabled:
          type: boolean
      required:
        - slug
        - enabled
      additionalProperties: false
    PublicProfile:
      type: object
      properties:
        displayName:
          type: string
        countries:
          type: array
          items:
            type: string
        stats:
          type: object
          properties:
            visits:
              type: integer
            photos:
              type: integer
          required:
            - visits
            - photos
          additionalProperties: false
      required:
        - displayName
        - countries
        - stats
      additionalProperties: false
    PlaceInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        kind:
          type: string
          enum:
            - country
            - city
            - place
        name:
          type: string
          minLength: 1
          maxLength: 120
        country:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          pattern: ^[A-Z]{2}$
        flag:
          type: string
          maxLength: 16
        coordinates:
          type: array
          prefixItems:
            - type: number
              minimum: -180
              maximum: 180
            - type: number
              minimum: -85
              maximum: 85
          items: false
          minItems: 2
          maxItems: 2
        image:
          type: string
          maxLength: 2048
        description:
          type: string
          maxLength: 250
      required:
        - id
        - name
        - country
        - code
        - flag
        - coordinates
        - image
        - description
      additionalProperties: false
    VisitInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        placeId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        date:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        title:
          default: ""
          type: string
          maxLength: 100
        memo:
          default: ""
          type: string
          maxLength: 500
        tripId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - id
        - placeId
        - date
        - title
        - memo
      additionalProperties: false
    UploadInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        visitId:
