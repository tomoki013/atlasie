name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: archive
          POSTGRES_PASSWORD: archive
          POSTGRES_DB: archive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run db:test
        env:
          MIGRATION_DATABASE_URL: postgres://archive:archive@localhost:5432/archive_test
      - run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE archive_test_client LOGIN PASSWORD 'test-only' NOSUPERUSER NOBYPASSRLS IN ROLE archive_api"
        env:
          MIGRATION_DATABASE_URL: postgres://archive:archive@localhost:5432/archive_test
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://archive_test_client:test-only@localhost:5432/archive_test
      - run: pnpm run build
      - run: pnpm run api:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results
